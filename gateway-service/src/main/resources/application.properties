spring.application.name=gateway-service
server.port=9000

eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

spring.cloud.gateway.server.webmvc.enabled=true

spring.cloud.gateway.server.webmvc.routes[0].id=catalogue
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://catalogue-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/produits,/api/v1/produits/**

spring.cloud.gateway.server.webmvc.routes[1].id=commande
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://commande-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/commandes,/api/v1/commandes/**

spring.cloud.gateway.server.webmvc.routes[2].id=paiement
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://paiement-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/paiements,/api/v1/paiements/**

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}
